<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ViHigh | Forgot Password</title>
	
	<link rel="stylesheet" href="../css/forgotPasswordCSS.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Princess+Sofia&display=swap" rel="stylesheet">
	
	<style>
		* {
			font-family: 'Poppins';
			font-size: 22px;
		}
	</style>
</head>
<body>
	<main>
		<div class="background-rectangle">
		<div class="content">
		<img src="../images/logoOnly.png" class="logo" alt="ViHigh Logo">
		
		<div class="form-container">
			<h2>Forgot Password</h2>
			<form id="forgot-form">
				<input type="text" class="username" placeholder="Username" required>
				<br>
				<input type="password" class="newPassword" placeholder="New password" required>
				<br>
				<input type="password" class="confirmPassword" placeholder="Confirm new password" required>
				<br>
				<button type="submit" class="submitButton">Reset Password</button>
			</form>
			<p class="redirect">Remember your password? <a href="loginPage.html">Back to Login</a>.</p>
		</div>
		</div>
		</div>
	</main>
	<script src="../js/forgotPassword.js"></script>
</body>
</html>
